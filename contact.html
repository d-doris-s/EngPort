<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Doris Siu</title>
    
    <link href="style.css" rel="stylesheet">
    
    <style>
        /* --- Contact Page Specific Styles --- */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 8rem 5% 5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
        }

        .contact-header h1 { font-size: 3.5rem; letter-spacing: -2px; margin: 0 0 1.5rem; line-height: 1.1; }
        .contact-header p { font-size: 1.2rem; color: var(--secondary); max-width: 400px; margin-bottom: 3rem; }

        .method-item { margin-bottom: 2rem; }
        .method-item h4 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: var(--secondary); margin-bottom: 0.5rem; }
        .method-item a { font-size: 1.2rem; color: var(--text); text-decoration: none; font-weight: 600; transition: var(--transition); }
        .method-item a:hover { color: var(--accent); }

        /* --- Form Style --- */
        #contact-form {
            background: var(--gray);
            padding: 3rem;
            border-radius: 32px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--secondary); }

        input, textarea {
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            background: white;
            transition: var(--transition);
        }

        input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(93, 53, 146, 0.1); }

        #submit-btn {
            background: var(--text);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
        }

        #submit-btn:hover { background: var(--accent); transform: translateY(-2px); }
        #submit-btn:disabled { background: var(--secondary); cursor: not-allowed; transform: none; }

        #status-msg { font-size: 0.9rem; font-weight: 600; text-align: center; display: none; margin-top: 1rem;}
        #status-msg.success { color: #2e7d32; display: block; }
        #status-msg.error { color: #d32f2f; display: block; }

        @media (max-width: 850px) { 
            .container { grid-template-columns: 1fr; padding-top: 6rem; } 
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">D.S. Portfolio</a>

        <input type="checkbox" id="nav-trigger" class="menu-toggle">
        <label for="nav-trigger" class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <div class="nav-links">
            <a href="work.html">Experience</a>
            <a href="project.html">Project</a>
            <a href="index.html#about">About</a>
            <a href="contact.html" class="nav-contact">Contact</a>
        </div>
    </nav>

    <main class="container">
        <div class="contact-header">
            <h1>Let's build <br>something new.</h1>
            <p>I'm always open to discussing engineering projects or design collaborations.</p>
            
            <div class="contact-methods">
                <div class="method-item">
                    <h4>Email</h4>
                    <a href="mailto:ddoriss1205@gmail.com">ddoriss1205@gmail.com</a>
                </div>
                <div class="method-item">
                    <h4>Linkedin</h4>
                    <a href="https://linkedin.com/in/doriss1205" target="_blank">linkedin.com/in/doriss1205/</a>
                </div>
            </div>
        </div>

        <div class="contact-form">
            <form id="contact-form" action="https://formspree.io/f/xlgplojr" method="POST">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Your message here..." required></textarea>
                </div>

                <button type="submit" id="submit-btn">Send Message</button>
                <p id="status-msg"></p>
            </form>
        </div>
    </main>

    <footer class="footer-main">
        <p>&copy; 2026 Doris Siu</p>
    </footer>

    <script>
        /* Form handling script stays exactly the same */
        const form = document.getElementById("contact-form");
        const button = document.getElementById("submit-btn");
        const status = document.getElementById("status-msg");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();
            button.disabled = true;
            button.innerText = "Sending...";
            
            const data = new FormData(event.target);
            
            fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    status.innerHTML = "Thanks! Your message has been sent.";
                    status.className = "success";
                    button.innerText = "Message Sent";
                    form.reset();
                } else {
                    status.innerHTML = "Oops! There was a problem.";
                    status.className = "error";
                    button.disabled = false;
                    button.innerText = "Send Message";
                }
            }).catch(error => {
                status.innerHTML = "Oops! There was a problem.";
                status.className = "error";
                button.disabled = false;
                button.innerText = "Send Message";
            });
        });
    </script>

</body>
</html>
